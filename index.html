<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business & Data Analytics | Financial Analytics | Charitha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  
  :root{
    --charcoal-950:#0C0F13;
    --navy-900:#111A26;
    --navy-800:#182534;
    --navy-700:#22344A;
    --paper:#0C0F13;
    --paper-2:#14191F;
    --white:#FFFFFF;
    --ink:#E8E5DD;
    --ink-soft:#B8C0C8;
    --mist:#8A93A3;
    --mist-on-dark:#98A3B8;
    --green:#D6B779;
    --green-soft:#E8D19D;
    --gold:#A9852F;
    --gold-soft:#E4D2A0;
    --rule:#DBD8CC;
    --rule-dark:#26303F;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:#0C0F13;
    color:#E8E5DD;
    font-family:'Inter', sans-serif;
    font-weight:400;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
}
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    margin:0;
    color:#F5F0E6;
    font-weight:600;
    letter-spacing:-0.01em;
}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
  section{position:relative;}
  ::selection{background:var(--green-soft); color:var(--charcoal-950);}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important; scroll-behavior:auto !important;} }

  /* ---------- NAV ---------- */
  #nav{ position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(12,15,19,0.94); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.08); }
  #nav .navwrap{ max-width:1180px; margin:0 auto; padding:0 28px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .brand{ display:flex; align-items:center; gap:10px; color:#D6B779; font-family:'IBM Plex Mono',monospace; font-size:13.5px; letter-spacing:.03em; }
  .brand .mark{ border:1px solid var(--green-soft); color:var(--green-soft); padding:3px 8px; border-radius:3px; font-size:12px; font-weight:600; }
  .navlinks{display:flex; gap:22px; align-items:center;}
  .navlinks a{ color:var(--mist-on-dark); font-size:13px; font-weight:500; letter-spacing:.01em; transition:color .2s ease; position:relative; white-space:nowrap;}
  .navlinks a:hover{
    color:#D6B779;
}
  .navlinks a::after{ content:""; position:absolute; left:0; bottom:-6px; width:0; height:1px; background:var(--green-soft); transition:width .25s ease; }
  .navlinks a:hover::after{width:100%;}
  .nav-cta{
    background:#D6B779;
    color:#11151A !important;
    padding:9px 17px;
    border-radius:4px;
    font-weight:600 !important;
    font-size:12px !important;
    transition:all .3s ease;
}

.nav-cta:hover{
    background:#E8D19D !important;
    transform:translateY(-2px);
}
  .burger{display:none; flex-direction:column; gap:4px; cursor:pointer; padding:8px;}
  .burger span{width:22px; height:2px; background:var(--white); display:block;}
  @media (max-width: 960px){
    .navlinks{ position:fixed; top:64px; left:0; right:0; background:var(--charcoal-950); flex-direction:column; align-items:flex-start; padding:18px 28px 26px; gap:16px; transform:translateY(-140%); transition:transform .3s ease; border-bottom:1px solid rgba(255,255,255,0.08); }
    .navlinks.open{transform:translateY(0);}
    .burger{display:flex;}
  }

  /* ---------- HERO ---------- */
  #hero{
    background: radial-gradient(1000px 480px at 12% -10%, rgba(31,122,86,0.18), transparent 60%), linear-gradient(180deg, var(--charcoal-950) 0%, var(--navy-900) 100%);
    padding:140px 0 90px; overflow:hidden; position:relative;
  }
  .hero-grid{ display:grid; grid-template-columns:0.85fr 1.15fr; gap:60px; align-items:center; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#D6B779; display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .eyebrow .dash{width:28px; height:1px; background:#D6B779; display:inline-block;}
  .hero-title{ color:var(--white); font-size:44px; line-height:1.12; font-weight:600; letter-spacing:-0.01em; }
  .hero-title em{
    font-style:italic;
    color:#D6B779;
    font-weight:500;
}
  .hero-sub{ margin-top:20px; color:var(--mist-on-dark); font-size:16px; max-width:520px; font-weight:300; }
  .hero-intro{ margin-top:18px; color:#CBD3E0; font-size:15.3px; max-width:520px; line-height:1.75; }
  .hero-ctas{display:flex; flex-wrap:wrap; gap:14px; margin-top:32px;}
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:13px 23px; font-size:13px; font-weight:600; letter-spacing:.02em; border-radius:2px; cursor:pointer; transition:all .22s ease; border:1px solid transparent; }
  .btn-primary{
    background:#D6B779;
    color:#11151A;
    border:1px solid #D6B779;
    transition:all .3s ease;
}

.btn-primary:hover{
    background:#E8D19D;
    border-color:#E8D19D;
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(214,183,121,.2);
}
  .btn-ghost{border:1px solid rgba(255,255,255,0.28); color:var(--white);}
  .btn-ghost:hover{
    border-color:#D6B779;
    color:#D6B779;
}
  .btn-dark{border:1px solid var(--charcoal-950); color:var(--charcoal-950);}
  .btn-dark:hover{background:var(--charcoal-950); color:var(--white);}

  .hero-photo-wrap{position:relative; max-width:380px; margin-left:auto;}
  .id-card{
    background:#171D24;
    border:1px solid rgba(214,183,121,.35);
    border-radius:10px;
    padding:18px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}
  .id-card::before, .id-card::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border:1.5px solid #D6B779;
    opacity:.85;
}
  .id-card::before{top:-1px; left:-1px; border-right:none; border-bottom:none;}
  .id-card::after{bottom:-1px; right:-1px; border-left:none; border-top:none;}
  .id-head{ display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--mist-on-dark); letter-spacing:.07em; text-transform:uppercase; margin-bottom:13px; }
  .id-head .live{
    color:#D6B779;
    display:flex;
    align-items:center;
    gap:5px;
}
  .live-dot{width:6px; height:6px; border-radius:50%; background:#D6B779; display:inline-block; animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .photo-frame{
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    border-radius:6px;
    border:1px solid rgba(214,183,121,.45);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}
  .photo-frame img{width:100%; height:100%; object-fit:cover;}
  .id-foot{ margin-top:13px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--mist-on-dark); }
  .id-foot b{
    color:#D6B779;
    font-weight:600;
}
  /* ---------- SECTION HEADERS ---------- */
  .section{padding:92px 0;}
  .section-alt{background:#14191F;}
  .sec-head{max-width:700px; margin-bottom:50px;}
  .sec-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#D6B779; display:flex; align-items:center; gap:10px; margin-bottom:15px; }
  .sec-eyebrow .dash{width:28px; height:1px; background:var(--green); display:inline-block;}
  .sec-title{font-size:32px; line-height:1.2;}
  .sec-lede{margin-top:13px; color:#B8B8B2; font-size:15px; max-width:600px;}

  
/* ---------- ABOUT ---------- */
#about .about-grid{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:60px;
  align-items:start;
}

.about-copy p{
  color:#B8C0C8;
  font-size:15px;
  margin:0 0 15px;
}

.about-copy p:first-child{
  font-family:'Fraunces', serif;
  font-size:19px;
  color:#E8E5DD;
  font-weight:500;
  line-height:1.55;
}

.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:20px;
}

.chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:7px 12px;
  border:1px solid #3A414A;
  border-radius:20px;
  color:#D6B779;
}

.fact-list{
  border-top:1px solid #3A414A;
}

.fact-row{
  padding:18px 0;
  border-bottom:1px solid #3A414A;
}

.fact-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#D6B779;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.fact-val{
  margin-top:5px;
  font-size:14.5px;
  color:#E8E5DD;
  font-weight:500;
}

  
/* ---------- EDUCATION ---------- */
.edu-list{
  border-top:1px solid #3A414A;
}

.edu-item{
  display:grid;
  grid-template-columns:110px 1fr 190px;
  gap:22px;
  align-items:center;
  padding:24px 0;
  border-bottom:1px solid #3A414A;
}

.edu-year{
  font-family:'IBM Plex Mono',monospace;
  color:#D6B779;
  font-weight:600;
  font-size:13px;
}

.edu-deg{
  font-family:'Fraunces',serif;
  font-size:18px;
  color:#F5F0E6;
  font-weight:600;
}

.edu-inst{
  color:#B8C0C8;
  font-size:13px;
  margin-top:4px;
}

.edu-score{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:#E8E5DD;
  text-align:right;
}

.edu-tag{
  display:inline-block;
  margin-top:4px;
  font-size:10px;
  font-family:'IBM Plex Mono',monospace;
  background:#302B20;
  color:#D6B779;
  padding:2px 8px;
  border-radius:10px;
}

@media (max-width:700px){
  .edu-item{
    grid-template-columns:1fr;
    gap:5px;
  }
  .edu-score{
    text-align:left;
  }
}


  /* ---------- INTERNSHIP PHASE RAIL + ACCORDION ---------- */
  .phase-rail{ display:flex; overflow-x:auto; gap:0; padding:6px 0 24px; margin-bottom:10px; }
  .phase{ flex:0 0 auto; width:150px; padding-right:20px; position:relative; }
  .phase:not(:last-child)::after{ content:""; position:absolute; top:7px; left:22px; right:-4px; height:1px; background:var(--rule); }
  .phase-dot{ width:15px; height:15px; border-radius:50%; background:var(--white); border:2px solid var(--green); position:relative; z-index:1; margin-bottom:12px; }
  .phase-num{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--mist); letter-spacing:.05em;}
  .phase-name{
  font-weight:600;
  font-size:13px;
  color:#F5F0E6;
  margin-top:4px;
  line-height:1.3;
}

  .cat-grid{display:flex; flex-direction:column; gap:14px;}
  .cat{ border:1px solid var(--rule); border-radius:4px; background:var(--white); overflow:hidden; }
  .cat-head{ display:flex; align-items:center; justify-content:space-between; gap:20px; padding:21px 25px; cursor:pointer; user-select:none; }
  .cat-head-left{display:flex; align-items:center; gap:17px;}
  .cat-letter{ font-family:'Fraunces',serif; font-size:21px; color:var(--green); font-weight:700; width:34px; text-align:center; }
  .cat-title{
  font-family:'Fraunces',serif;
  font-size:18px;
  color:#F5F0E6;
  font-weight:600;
}
  .cat-sub{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--mist); margin-top:3px;}
  .cat-arrow{ width:25px; height:25px; border:1px solid var(--rule); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .3s ease; }
  .cat.open .cat-arrow{transform:rotate(45deg);}
  .cat-body{ max-height:0; overflow:hidden; transition:max-height .4s ease; }
  .cat.open .cat-body{max-height:900px;}
  .cat-body-inner{ padding:0 25px 27px; display:grid; grid-template-columns:1.3fr 1fr; gap:26px; border-top:1px solid var(--rule); padding-top:20px; }
  .cat-col-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--green); letter-spacing:.09em; text-transform:uppercase; margin-bottom:9px; display:block; }
  .cat-body ul{margin:0; padding-left:18px; color:var(--ink-soft); font-size:13.4px;}
  .cat-body ul li{margin-bottom:7px;}
  .tool-tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .tool-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  padding:5px 10px;
  background:#302B20;
  color:#D6B779;
  border:1px solid #51452F;
  border-radius:3px;
}
  @media (max-width:700px){ .cat-body-inner{grid-template-columns:1fr;} }

  /* ---------- WHAT I LEARNED ---------- */
  .learn-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); }
  .learn-card{background:var(--white); padding:26px 24px;}
  .learn-num{font-family:'IBM Plex Mono',monospace; color:var(--green); font-size:11px;}
  .learn-card h4{font-size:15px; margin-top:10px; margin-bottom:8px; font-weight:600;}
  .learn-card p{margin:0; font-size:12.8px; color:var(--ink-soft);}
  @media (max-width:900px){ .learn-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .learn-grid{grid-template-columns:1fr;} }

  
/* ---------- SKILLS DASHBOARD ---------- */

.skill-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.skill-card {
  border: 1px solid #303740;
  border-radius: 12px;
  padding: 26px;
  background: #171D24;
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}


.skill-card:hover {
  transform: translateY(-6px);
  border-color: #D6B779;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
}

.skill-card h4 {
  font-size: 13px;
  color: #D6B779;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.04em;
  margin-bottom: 10px;
  text-transform: uppercase;
  font-weight: 700;
  line-height: 1.6;
}

.skill-card .exposure-note {
  font-size: 11px;
  color: #B8C0C8;
  margin-bottom: 18px;
  font-style: italic;
  line-height: 1.6;
}


.badge-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.badge {
  font-size: 12px;
  padding: 8px 12px;
  background: var(--paper-2);
  color: var(--navy-800);
  border: 1px solid transparent;
  border-radius: 6px;
  font-weight: 500;
  transition: all 0.25s ease;
}

.badge:hover {
  background: var(--green);
  color: white;
  transform: translateY(-2px);
}

@media (max-width: 980px) {
  .skill-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .skill-grid {
    grid-template-columns: 1fr;
  }

  .skill-card {
    padding: 22px;
  }
}


  /* ---------- PROJECTS ---------- */
  .proj-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  .proj-card{
    border:1px solid #303740;
    border-radius:12px;
    padding:28px;
    background:#171D24;
    display:flex;
    flex-direction:column;
    transition:transform .35s ease, border-color .35s ease, box-shadow .35s ease;
}
  .proj-card:hover{
    transform:translateY(-7px);
    border-color:#D6B779;
    box-shadow:0 18px 40px rgba(0,0,0,.3);
}
  .proj-card.feature{
    grid-column:1/-1;
    border-color:#D6B779;
    background:linear-gradient(135deg,#1C242D,#171D24);
}
  .proj-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#D6B779;
    background:#302B20;
    display:inline-block;
    padding:5px 11px;
    border-radius:4px;
    margin-bottom:14px;
    width:fit-content;
}
  .proj-card h4{
    font-size:16.5px;
    line-height:1.35;
    margin-bottom:14px;
}
  .proj-sub{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--green); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px;}
  .proj-card p.body-text{
    color:#B8C0C8;
    font-size:13.3px;
    margin:0 0 8px;
}
  .proj-skill-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:auto; padding-top:14px;}
  @media (max-width:820px){ .proj-grid{grid-template-columns:1fr;} }

  /* ---------- WORK EXPERIENCE ---------- */
  .work-list{display:flex; flex-direction:column;}
  .work-item{ display:grid; grid-template-columns:250px 1fr; gap:34px; padding:30px 0; border-bottom:1px solid var(--rule); }
  .work-item:first-child{border-top:1px solid var(--rule);}
  .work-role{
  font-family:'Fraunces',serif;
  font-size:18px;
  color:#F5F0E6;
  font-weight:600;
}  
  .work-org{
  color:#D6B779;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  margin-top:6px;
}
  .work-item ul{
  margin:0;
  padding-left:18px;
  color:#B8C0C8;
  font-size:13.4px;
}
  .work-meta{color:var(--mist); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:6px;}
  .work-item ul li{margin-bottom:7px;}
  @media (max-width:760px){ .work-item{grid-template-columns:1fr; gap:12px;} }

  /* ---------- JOURNEY (signature vertical flow) ---------- */
  #journey{background:var(--charcoal-950); color:var(--white);}
  #journey .sec-title{color:var(--white);}
  #journey .sec-lede{color:var(--mist-on-dark);}
  #journey .sec-eyebrow{color:var(--green-soft);}
  #journey .sec-eyebrow .dash{background:var(--green-soft);}
  .flow{max-width:640px; margin:0 auto;}
  .flow-step{ display:grid; grid-template-columns:50px 1fr; gap:20px; position:relative; padding-bottom:6px;}
  .flow-marker{display:flex; flex-direction:column; align-items:center;}
  .flow-dot{ width:38px; height:38px; border-radius:50%; border:1.5px solid var(--green-soft); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--green-soft); flex-shrink:0; background:var(--navy-900); }
  .flow-line{width:1.5px; flex:1; background:var(--rule-dark); min-height:34px;}
  .flow-step:last-child .flow-line{display:none;}
  .flow-content{padding-bottom:34px;}
  .flow-content h4{color:var(--white); font-size:16.5px; margin-bottom:6px; font-weight:600;}
  .flow-content p{color:var(--mist-on-dark); font-size:13px; margin:0;}

  /* ---------- LEADERSHIP ---------- */
  .lead-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  .lead-card{
  border:1px solid #303740;
  border-radius:10px;
  padding:24px;
  background:#171D24;
  transition:transform .3s ease, border-color .3s ease;
}

.lead-card:hover{
  transform:translateY(-5px);
  border-color:#D6B779;
}

.lead-card h4{
  font-size:15.5px;
  margin-bottom:8px;
  color:#F5F0E6;
}

.lead-card p{
  color:#B8C0C8;
  font-size:13.3px;
  margin:0;
}
  .transfer-row{display:flex; flex-wrap:wrap; gap:9px; margin-top:30px;}
  @media (max-width:760px){ .lead-grid{grid-template-columns:1fr;} }

  /* ---------- STRENGTHS ---------- */
  .strength-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:16px;}
  .strength-card{ border:1px solid var(--rule); border-radius:6px; padding:22px 16px; text-align:center; background:var(--white); transition:transform .25s ease, border-color .25s ease; }
  .strength-card:hover{transform:translateY(-4px); border-color:var(--green);}
  .strength-card .sicon{ width:34px; height:34px; margin:0 auto 12px; border-radius:50%; background:var(--green-soft); display:flex; align-items:center; justify-content:center; color:var(--green); font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; }
  .strength-card h4{font-size:13px; font-weight:600;}
  @media (max-width:900px){ .strength-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:600px){ .strength-grid{grid-template-columns:1fr 1fr;} }

  
/* ---------- RESUME ---------- */
.resume-panel{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:48px;
  align-items:center;
  border:1px solid rgba(214,183,121,.4);
  border-radius:10px;
  padding:42px;
  background:#171D24;
}

.resume-panel h3{
  font-size:22px;
  margin-bottom:13px;
  color:#F5F0E6;
}

.resume-panel p{
  color:#B8C0C8;
  font-size:14px;
  margin-bottom:20px;
}

.resume-mini-list{
  display:flex;
  flex-direction:column;
  gap:11px;
  margin-bottom:24px;
}

.resume-mini-item{
  display:flex;
  gap:11px;
  font-size:13px;
  color:#E8E5DD;
}

.resume-mini-item .dot{
  width:6px;
  height:6px;
  background:#D6B779;
  border-radius:50%;
  margin-top:7px;
  flex-shrink:0;
}

.resume-btn-row{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.doc-preview{
  background:#0C0F13;
  border:1px solid #3A414A;
  border-radius:6px;
  padding:28px;
}

.doc-preview .doc-line{
  height:8px;
  background:#3A414A;
  border-radius:2px;
  margin-bottom:10px;
}

.doc-preview .doc-line.short{width:55%;}
.doc-preview .doc-line.med{width:78%;}

.doc-head-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
  align-items:center;
}

.doc-head-row .fname{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#B8C0C8;
}

.doc-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  background:#302B20;
  color:#D6B779;
  padding:3px 8px;
  border-radius:3px;
}

@media (max-width:860px){
  .resume-panel{grid-template-columns:1fr;}
}


  /* ---------- CONTACT ---------- */
  #contact{background:var(--charcoal-950); color:var(--white); padding:92px 0 56px;}
  #contact .sec-title{color:var(--white); font-size:34px; max-width:560px;}
  #contact .sec-lede{color:var(--mist-on-dark);}
  .contact-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule-dark); border:1px solid var(--rule-dark); margin-top:40px;}
  
.contact-item{
  background:#171D24;
  padding:28px 22px;
  transition:background .3s ease, transform .3s ease;
}

.contact-item:hover{
  background:#202832;
}

.contact-item .clbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#D6B779;
  margin-bottom:11px;
  display:block;
}

  .contact-item .cval{font-size:14.5px; color:var(--white); font-weight:500; word-break:break-word;}
  .contact-item .cnote{font-size:11px; color:var(--mist-on-dark); margin-top:6px;}
  @media (max-width:900px){ .contact-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .contact-grid{grid-template-columns:1fr;} }

  footer{background:var(--charcoal-950); border-top:1px solid var(--rule-dark); padding:24px 0;}
  .foot-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .foot-row span{color:var(--mist-on-dark); font-family:'IBM Plex Mono',monospace; font-size:11px;}

  /* back to top */
  #toTop{
  position:fixed;
  bottom:26px;
  right:26px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#D6B779;
  color:#11151A;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease, transform .2s ease;
  z-index:90;
  font-size:16px;
  box-shadow:0 10px 25px -8px rgba(0,0,0,.4);
}
  #toTop.show{opacity:1; pointer-events:auto;}
  #toTop:hover{transform:translateY(-3px);}

  .reveal{opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  @media (max-width:980px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-photo-wrap{max-width:320px; margin:0;}
    .hero-title{font-size:36px;}
    #about .about-grid{grid-template-columns:1fr; gap:34px;}
    .skill-grid{grid-template-columns:1fr 1fr;}
    .proj-grid{grid-template-columns:1fr;}
  }
  @media (max-width:600px){
    .wrap{padding:0 20px;}
    .section{padding:66px 0;}
    .hero-title{font-size:29px;}
    .sec-title{font-size:25px;}
  }


/* ===== PROJECT FILTER BUTTONS ===== */

.project-filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 30px 0;
}

.filter-btn {
  padding: 10px 20px;
  border: 1px solid #D6B779;
  border-radius: 25px;
  background: transparent;
  color: #E8E5DD;
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  transition: all 0.3s ease;
}

.filter-btn:hover,
.filter-btn.active {
  background: #D6B779;
  color: #11151A;
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(214,183,121,.18);
}


/* ===== PROJECT CARD HOVER ===== */

.proj-card {
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.proj-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

/* ===== PROJECT DETAILS POPUP ===== */

.project-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,0.75);
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.project-modal.show {
  display: flex;
}

.project-modal-content {
  position: relative;
  width: 100%;
  max-width: 650px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 35px;
  border-radius: 18px;
  background: #fff;
  color: #172033;
  animation: popupAppear 0.3s ease;
}

.project-modal-content h2 {
  margin: 18px 0;
  font-size: 25px;
}

.project-modal-content h4 {
  margin: 20px 0 8px;
  color: #a47b3d;
}

.project-modal-content p {
  line-height: 1.7;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 18px;
  border: none;
  background: transparent;
  color: #172033;
  font-size: 30px;
  cursor: pointer;
}

#modalSkills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

#modalSkills span {
  padding: 7px 12px;
  border-radius: 15px;
  background: #eee8dd;
  font-size: 12px;
}

@keyframes popupAppear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  .project-modal-content {
    padding: 25px 20px;
  }
}

/* ==========================================================
   CRV PORTFOLIO — ACCESSIBILITY & VISUAL CONSISTENCY PATCH
   Keeps the original layout, content, data and interactions.
   ========================================================== */
:root {
  --charcoal-950: #0C1017;
  --navy-900: #111A26;
  --navy-800: #182534;
  --navy-700: #22344A;
  --paper: #0C1017;
  --paper-2: #202B3A;
  --white: #FFFFFF;
  --ink: #E8EAF0;
  --ink-soft: #465160;
  --mist: #AAB4C2;
  --mist-on-dark: #C0C8D2;
  --green: #D6B779;
  --green-soft: #E8D19D;
  --gold: #A9852F;
  --gold-soft: #E4D2A0;
  --rule: #D8D2C5;
  --rule-dark: #303B4A;
}

html { scroll-padding-top: 78px; }
body { color: #E8EAF0; background: #0C1017; }
::selection { background: #E8D19D; color: #10151D; }

/* Clear, readable section introductions */
.sec-title, h1, h2, h3, h4 { color: #F7F4ED; }
.sec-lede { color: #C0C8D2; }
.sec-eyebrow { color: #E8D19D; }
.sec-eyebrow .dash { background: #D6B779; }

/* About and education: preserve the dark editorial treatment */
.about-copy p { color: #C0C8D2; }
.about-copy p:first-child { color: #F0EEE8; }
.fact-val, .edu-score { color: #E8EAF0; }
.edu-inst { color: #C0C8D2; }
.edu-deg { color: #F7F4ED; }

/* Internship accordion: dark ink on warm ivory cards */
.cat {
  background: #F4F1E9;
  border: 1px solid #D8D0C0;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.cat-head { color: #202A36; }
.cat-title { color: #202A36 !important; }
.cat-sub { color: #596575 !important; }
.cat-letter { color: #98722F !important; }
.cat-arrow { color: #202A36; border-color: #BEB5A5; }
.cat-arrow svg, .cat-arrow span { color: #202A36; }
.cat-body-inner { border-top-color: #D8D0C0; }
.cat-col-label { color: #8B6728 !important; }
.cat-body ul { color: #394452 !important; }
.cat-body ul li { line-height: 1.65; }
.tool-tag {
  background: #E8E0D1;
  color: #57421D;
  border-color: #CFC1A8;
}

/* Learning outcome cards: prevent white-on-white text */
.learn-grid { background: #D8D0C0; border-color: #D8D0C0; }
.learn-card { background: #F4F1E9; }
.learn-card h4 { color: #202A36 !important; }
.learn-card p { color: #465160 !important; }
.learn-num { color: #98722F !important; }

/* Skills: clear white labels on dark blue pills */
.skill-card { background: #171F2B; border-color: #354255; }
.skill-card h4 { color: #E8D19D; }
.skill-card .exposure-note { color: #C0C8D2; }
.badge {
  background: #26364B !important;
  color: #FFFFFF !important;
  border: 1px solid #52647A !important;
  border-radius: 7px;
  font-weight: 600;
}
.badge:hover, .badge:focus-visible {
  background: #E8D19D !important;
  color: #17202B !important;
  border-color: #E8D19D !important;
}

/* White strength cards need dark headings */
.strength-card { background: #F4F1E9; border-color: #D8D0C0; }
.strength-card h4 { color: #202A36 !important; }
.strength-card .sicon { color: #6E5427; background: #E8D19D; }

/* Dark cards: maintain comfortable contrast */
.proj-card, .lead-card, .resume-panel, .contact-item {
  background-color: #171F2B;
  border-color: #354255;
}
.proj-card p.body-text, .lead-card p, .resume-panel p,
.work-item ul { color: #C0C8D2; }
.work-role, .lead-card h4, .resume-panel h3 { color: #F7F4ED; }
.work-meta { color: #AAB4C2; }

/* Navigation and keyboard accessibility */
#nav { background: rgba(12,16,23,.96); }
.navlinks a { color: #C0C8D2; }
.navlinks a:hover, .navlinks a:focus-visible { color: #E8D19D; }
a:focus-visible, button:focus-visible, [role="button"]:focus-visible,
.cat-head:focus-visible, .burger:focus-visible {
  outline: 3px solid #E8D19D;
  outline-offset: 4px;
}

/* Do not leave page content invisible if the reveal observer is unavailable */
.reveal { opacity: 1; transform: none; }
.reveal.in { opacity: 1; transform: none; }

/* Responsive spacing and horizontal overflow protection */
img, video, iframe { max-width: 100%; }
.wrap { width: 100%; }
.phase-rail { scrollbar-width: thin; scrollbar-color: #8B7448 #202B3A; }
@media (max-width: 960px) {
  .navlinks { background: #101722; }
}
@media (max-width: 700px) {
  .cat-head { padding: 18px 16px; gap: 12px; }
  .cat-head-left { gap: 10px; }
  .cat-title { font-size: 16px; }
  .cat-body-inner { padding: 18px 16px 22px; }
  .edu-item { grid-template-columns: 1fr; gap: 5px; }
  .edu-score { text-align: left; }
  .section { padding: 68px 0; }
}
@media (max-width: 600px) {
  .wrap { padding-left: 18px; padding-right: 18px; }
  .hero-title { overflow-wrap: anywhere; }
  .sec-title { font-size: clamp(25px, 7vw, 32px); }
  .skill-card, .proj-card, .lead-card { padding: 21px; }
  .resume-panel { padding: 24px 20px; }
  #toTop { right: 16px; bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
